- name       : "Camille Butera"
  position   : "Ph.D. Student"
  program    : "Information Science"
  email      : "camille.butera@colorado.edu"
  bio        : "I am a first year PhD student in Information Science. Previously I completed a BA in Sociology at Smith College, an MSc in the Social Science of the Internet at the Oxford Internet Institute. My research focuses on the ways in which the design and infrastructure of technology shapes the way we conceptualize ourselves and our ties to other. Outside of the lab, I'm currently trying to learn as many kinds of fiber arts as I feasibly can."
