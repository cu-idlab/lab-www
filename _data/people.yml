  bio        : "I am a Ph.D student in Information Science researching the intersection between death, grief and technology design and investigating how online platforms and communities might better embed values of empathy to sustain holistic systems of support for their users. I am an ordained Unitarian Universalist minister and former hospital chaplain. In my spare time I host The Radical AI Podcast, play guitar, and run marathons."
