- name       : "Dylan Thomas Doyle"
  position   : "Ph.D. Candidate"
  program    : "Information Science"
  email      : "Dylan.doyle@colorado.edu"
  bio        : "I'm a Post-Doctoral Researcher in the ID Lab. As an HCI researcher, my work focuses on the intersection of values-based design and organizational systems, particularly within emotionally intense scenarios such as end-of-life support. I'm also the Director of the AI for All Tomorrows non-profit and podcast. I received my PhD from the University of Colorado Boulder, Masters of Divinity from Columbia University, and BA from Sarah Lawrence College. Prior to a career in technology research, I served as a Unitarian Universalist minister and hospital chaplain."
  uri        : "http://dylanthomasdoyle.com"
  avatar     : images/members/dylandoyle.jpeg
  twitter    : "dylantdoyle"

