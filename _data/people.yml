- name        : "Morgan Klaus Scheuerman"
  position    : "Post-doctoral Scholar"
  program     : "Information Science"
  email       : "Morgan.Scheuerman@colorado.edu"
  bio         : "Morgan Klaus Scheuerman is a postdoctoral associate in Information Science at University of Colorado Boulder. He recently completed his PhD at Boulder as a Microsoft Research Fellow. His research focuses on experiences and representations of human identity in technological systems. He is primarily focused on how human identity is embedded in computer vision - how identity is constructed for computer vision and how those decisions are made by human actors. He has published award winning work in top-tier social computing journals and conferences, including Big Data + Society, CSCW, CHI, and FAccT. He has done industry work with Facebook’s Community Integrity, Google’s Ethical AI, Microsoft Research’s FATE, and Twitch’s Trust & Safety. He has co-organized workshops/special interest groups at NeurIPS, CHI and CSCW. He received a BA in Communication with a minor in Gender Studies from Goucher College and an MS in Human-Centered Computing from University of Maryland Baltimore County."
  avatar      : images/members/morgan_bio.png
  uri         : "https://www.morgan-klaus.com"
  twitter     : "morganklauss"

- name        : "Kandrea Wade"
  position    : "Ph.D. Student"
  program     : "Information Science"
  email       : "Kandrea.Wade@colorado.edu"
  bio         : "I am a PhD student in Information Science where I research algorithmic identity and the digital surveillance of marginalized groups in order to create ethical regulations, legal protections and education on algorithmic identity and digital literacy. I received my MA in Media, Culture and Communications from New York University and BA in Technical Theatre from The University of Texas at Arlington."
  avatar      : images/members/kandrea_wade_bio.jpg

- name        : "Malinda (Mally) Dietrich"
  position    : "Ph.D. Canidate"
  program     : "Communication"
  email       : "malinda.dietrich@colorado.edu"
  twitter     : "mallydietrich"
  bio         : "As a PhD student in the Communication department, I strive to be an interdisciplinary scholar interested in understanding how technologies inscribe data and organize information through mainly ethnographic and archival methods. I earned my B.A. in Communication (concentration in Media) and my M.S. in Communication from North Carolina State University. I enjoy caffeine consumption, hiking (read: spending time with my dog), playing video games, making art, and watching hockey."
  avatar      : images/members/mally_dietrich_bio.jpeg

- name        : "Katy Weathington"
  position    : "Ph.D. Student"
