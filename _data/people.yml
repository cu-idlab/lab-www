- name       : "Adrian Petterson"
  position   : "Ph.D. Student"
  program    : "Information Science (Toronto)"
  bio        : "I am a Ph.D student in Information Science at the University of Toronto researching networks of informal care for people seeking abortions and leveraging design for social justice. I have a Master's in UX Design and I am an organizing member of the Toronto Design Justice Network Node. Outside of research, I like music jams, trail running and petting cats."
