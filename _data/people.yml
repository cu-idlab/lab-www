  program    : "Information Science"
  email      : "Dylan.doyle@colorado.edu"
  bio        : "My work focuses on the intersection of values-based design and organizational systems, particularly within emotionally intense scenarios such as end-of-life support. I'm also the Director of the AI for All Tomorrows non-profit and podcast. I received my PhD from the University of Colorado Boulder, a Master of Divinity from Columbia University, and BA from Sarah Lawrence College. Prior to a career in technology research, I served as a Unitarian Universalist minister and hospital chaplain."
