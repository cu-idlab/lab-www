- name        : "Jes Feuston"
  position    : "Postdoctoral Researcher"
  program     : "Information Science"
  uri         : "http://jesfeuston.com/"
  email       : "jessica.feuston@colorado.edu"
  bio         : "I'm a postdoctoral associate and digital ethnographer in the Department of Information Science at CU Boulder. I completed my Ph.D. at Northwestern University, where I studied how people with mental illness participate online. Recently, my research also involves exploring tools to support qualitative researchers and research practices. I love my plants, embroidery, and my many animal and plant neighbors who graciously tolerate my presence in the yard."
  avatar      : images/members/feuston_bio.jpg

- name        : "Michael Ann DeVito"
  position    : "Postdoctoral Researcher"
  program     : "Information Science"
  uri         : "http://michaelanndevito.com"
  email       : "mide6488@colorado.edu"
  bio         : "I’m a postdoctoral Computing Innovation Fellow and qualitative HCI researcher with a Ph.D. from Northwestern University. I study how users and communities understand and adapt to the challenges of everyday, casual human/AI collaboration. This includes work on folk understandings of algorithms, as well as work on how queer and trans communities adapt to social platforms. Outside the lab, I am mostly about cats, space, playing bass, and being in the snow."
  avatar      : images/members/devito_bio.jpg
  twitter     : "drmichaelann"

- name        : "Anthony Pinter"
  position    : "Ph.D. Candidate"
  program     : "Information Science"
  email       : "anthony.pinter@colorado.edu"
  bio         : "I am a PhD Candidate in Information Science. My research focuses on how identity in constructed through our relationships with others in the wake of romantic breakups. In addition to my research, I've also garnered recognition for my teaching and service work at CU Boulder and elsewhere. Outside of my work in those realms, I enjoy spending my time outside, where I ride bikes and skis whenever possible, for as long as possible."
  uri         : "http://www.anthonypinter.com"
  avatar      : images/members/anthonypinter.jpg
  facebook    : "ATPinter"
  instagram   : "https://www.instagram.com/anthonypinter/"

- name        : "Morgan Klaus Scheuerman"
  position    : "Ph.D. Student"
  program     : "Information Science"
  email       : "Morgan.Scheuerman@colorado.edu"
  bio         : "I explore how individuals with diverse gender identities interact with technology. I earned a B.A. in Communication & Media Studies with a minor in Gender Studies at Goucher College and a M.S. in Human-Centered Computing at University of Maryland, Baltimore County. In my spare time, I enjoy travel, hiking, photography, and consuming snobby hipster coffee beverages in mid-century modern cafes."
  avatar      : images/members/morgan_bio.png
  uri         : "https://www.morgan-klaus.com"
  twitter     : "morganklauss"

- name        : "Kandrea Wade"
  position    : "Ph.D. Student"
  program     : "Information Science"
  email       : "Kandrea.Wade@colorado.edu"
  bio         : "I am a PhD student in Information Science where I research algorithmic identity and the digital surveillance of marginalized groups in order to create ethical regulations, legal protections and education on algorithmic identity and digital literacy. I received my MA in Media, Culture and Communications from New York University and BA in Technical Theatre from The University of Texas at Arlington."
  avatar      : images/members/kandrea_wade_bio.jpg

- name        : "Malinda (Mally) Dietrich"
  position    : "Ph.D. Student"
  program     : "Communication"
  email       : "malinda.dietrich@colorado.edu"
  twitter     : "mallydietrich"
  bio         : "As a PhD student in the Communication department, I strive to be an interdisciplinary scholar interested in understanding how technologies inscribe data and organize information through mainly ethnographic and archival methods. I earned my B.A. in Communication (concentration in Media) and my M.S. in Communication from North Carolina State University. I enjoy caffeine consumption, hiking (read: spending time with my dog), playing video games, making art, and watching hockey."
  avatar      : images/members/mally_dietrich_bio.jpeg

- name        : "Katy Weathington"
  position    : "Ph.D. Student"
  program     : "Information Science"
  email       : "katy.weathington@colorado.edu"
  bio         : "Katy Weathington is a second year PhD student at University of Colorado Boulder's Department of Information Science. Her research centers on how data about marginalized people, primarily those with queer identites, gets made and implemented. She is co-advised by Brian Keegan"
