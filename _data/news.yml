- headline    : Brubaker and Jiang talked to CGTN about digital afterlives
  body        : As our lives go digital, we are studying what happens to all that data after we die. Our research on digital afterlives was [covered by CGTN](https://news.cgtn.com/news/7a556a4e7a454464776c6d636a4e6e62684a4856/share_p.html).
