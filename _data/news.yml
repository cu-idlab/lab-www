- headline    : Two papers accepted to ICWSM 2018
  body        : Aaron Jiang and Prof. Jed Brubaker had two papers accepted to ICWSM 2018. One paper on post-mortem language and another on rules on Reddit (co-authored with Prof. Casey Fiesler and two undergraduate RAs). They will present the papers in late June in Stanford, California.
  date        : 2018-04-10 12:00:00

