- headline    : New work on mortality data, grief letters, breakups, and audits of NLP
  body        : We've published a series of papers at CSCW this year! [Read them here.](https://cmci.colorado.edu/idlab/publications/)
  date        : 2024-11-14 12:00:00

- headline    : New research on narrative and healing in online suicide bereavement published at ICWSM 2024
  body        : Doyle, Brubaker, Voida, and Keegan identify a linguistic signature for narrative bereavement posts, offering a path for platforms to better support grieving users. [Read it here.](https://ojs.aaai.org/index.php/ICWSM/article/view/31319)
  date        : 2024-06-01 12:00:00

- headline    : Our research earns a SIGCHI Best Paper award at CHI 2024
  body        : '"Products of Positionality" reveals how tech worker backgrounds shape algorithmic identity models, sparking debates on bias in computer vision. [Read the paper here.](https://cmci.colorado.edu/idlab/publications/)'
  date        : 2024-05-16 12:00:00

- headline    : New work on relationship-based end-of-life data planning
  body        : Doyle and Brubaker conducted co-design sessions to help people plan for their personal data after death, offering recommendations to improve end-of-life data planning tools. The paper appeared at CHI 2024. [Read it here.](https://dl.acm.org/doi/10.1145/3613904.3642250)
  date        : 2024-05-16 12:00:00

- headline    : Auditing NLP tools for identity-based biases
  body        : Brubaker collaborated on work revealing how Bengali sentiment analysis tools encode identity-based biases rooted in colonial language hierarchies. The paper appeared at CHI 2024. [Read it here.](https://dl.acm.org/doi/10.1145/3613904.3642669)
  date        : 2024-05-16 12:00:00

