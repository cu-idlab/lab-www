- headline    : New research to appear at DIS 2026 explores how people engage with AI representations of the dead
  body        : Our latest work examines how people interact with "generative ghosts" — AI systems that simulate deceased loved ones — finding that emotional authenticity matters more than factual accuracy. The paper will appear at ACM DIS 2026.
  date        : 2026-03-27 12:00:00

- headline    : New work at CSCW 2026 on end-of-life values in electronic health records
  body        : Doyle and Brubaker reveal how EHR systems fail to consistently support the documentation and transfer of patients' end-of-life values across care settings. The paper will appear at ACM CSCW 2026.
  date        : 2026-03-27 12:00:00

- headline    : Brubaker gives invited talk at UT Austin on "Clinic as Method"
  body        : Brubaker presented the Digital Legacy Clinic as a model for combining research, teaching, and direct public support in a colloquium at UT Austin's iSchool.
  date        : 2026-03-11 12:00:00

- headline    : We talked generative ghosts at SXSW 2026
  body        : Dylan Doyle and Brubaker joined Iason Gabriel and Meredith Ringel Morris from Google DeepMind for a panel at SXSW on the social, ethical, and emotional consequences of generative ghosts.
  date        : 2026-03-10 12:00:00

- headline    : Thangaraj and collaborators receive Best Paper Award at CHI 2026
  body        : Congratulations to the team — Ramprabu Thangaraj, Jed Brubaker, Emma Dixon, and Alisha Pradhan — whose paper earned a Best Paper Award at CHI 2026. This work focused on older adults and post-mortem data is a collaboration with NJIT.
  date        : 2026-03-09 12:00:00

- headline    : Our work on generative ghosts written up in AI Policy Perspectives
  body        : Brubaker co-authored an article with Meredith Ringel Morris and Tom Rachman exploring the benefits and risks of "generative ghosts" — AI representations of the deceased. [Read it here.](https://www.aipolicyperspectives.com/p/ghosts-the-ai-afterlife)
  date        : 2026-02-18 12:00:00

- headline    : OpenAI funds research on mental health and generative ghost systems
  body        : Brubaker and Doyle received an OpenAI AI and Mental Health Grant for "Red-Teaming the Afterlife," a project developing empirical safety benchmarks for AI systems that simulate deceased individuals. Kate Gerber (RMIT) joins as Co-PI.
  date        : 2026-01-15 12:00:00

- headline    : Brubaker contributes to short film 'Sweetwater'
  body        : On December 4, Jed Brubaker attended the LA premiere of 'Sweetwater', a short film exploring the intersection of AI, mortality, and memory. Brubaker contributed as a storyline consultant to the film.
  date        : 2025-12-04 12:00:00

- headline    : "Brubaker on Science Friday: Rethinking the Digital Afterlife"
  body        : Jed Brubaker appeared on Science Friday to discuss how we remember the dead in the digital age. [Listen here.](https://www.sciencefriday.com/segments/digital-afterlife/)
  date        : 2025-10-30 12:00:00

- headline    : "Public Talk at Boulder Library: Your Digital Afterlife"
  body        : Jed Brubaker and Dylan Doyle presented a community talk at Boulder Public Library on planning for your digital afterlife.
  date        : 2025-10-07 12:00:00

- headline    : Google continues support for generative ghosts research
  body        : We received a second Google research award to study user perspectives on designing their future generative ghosts, continuing work on AI systems based on data about the deceased.
  date        : 2025-10-01 12:00:00

- headline    : International grant funds research on DIY end-of-life practices
  body        : Brubaker joins an international team on an Australian Research Council Discovery Project studying how DIY approaches are reshaping end-of-life practices and what new practices technology might enable. [Learn more.](https://deathtech.research.unimelb.edu.au/home/projects/)
  date        : 2025-01-15 12:00:00

- headline    : Brubaker selected as RIO Faculty Fellow
  body        : Brubaker was selected as a member of the 2026 cohort of the RIO Faculty Fellows program — a selective, campus-wide initiative that cultivates faculty poised to lead high-impact collaborative research. [Learn more.](https://www.colorado.edu/researchinnovation/2025/12/08/2026-rio-faculty-fellows-cohort-spans-departments-and-disciplines-across-campus)
  date        : 2025-12-01 12:00:00

- headline    : Brubaker receives Payden Faculty Excellence Award
  body        : Brubaker received the Payden Award, the top faculty award in the college, which recognizes excellence in teaching, research, and creative work. [Learn more.](https://www.colorado.edu/cmdi/faculty-staff/cmci-grants/payden-faculty-excellence-award)
  date        : 2024-05-01 12:00:00

- headline    : CU Boulder Today spotlights Doyle's research on online suicide bereavement
  body        : Our work on how people seek support online after losing someone to suicide was featured in CU Boulder Today. [Read it here.](https://www.colorado.edu/today/2024/09/24/after-suicide-more-loved-ones-are-seeking-support-online-does-it-help-or-harm)
  date        : 2024-09-24 12:00:00

- headline    : Our AI afterlife research featured in the Denver Post
  body        : Our work on generative ghosts and the future of AI-driven interactions with the deceased was featured in the Denver Post. [Read it here.](https://www.denverpost.com/2024/10/18/ai-chatbot-generative-ghosts-dead-google-cu-boulder/)
  date        : 2024-10-18 12:00:00

- headline    : Google Academic Research Award supports work on Generative Ghosts
  body        : We received a Google Academic Research Award for "Generative Ghosts," a project empirically evaluating design spaces for death and generative AI agents. [Learn more.](https://research.google/programs-and-events/google-academic-research-awards/google-academic-research-award-program-recipients/?filtertab=2024)
  date        : 2024-10-01 12:00:00

