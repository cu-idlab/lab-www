- name        : "Michael Ann DeVito"
  position    : "Postdoctoral Researcher"
  program     : "Information Science"
  uri         : "http://michaelanndevito.com"
  email       : "mide6488@colorado.edu"
  bio         : "I'm a postdoctoral Computing Innovation Fellow and qualitative HCI researcher with a Ph.D. from Northwestern University. I study how users and communities understand and adapt to the challenges of everyday, casual human/AI collaboration. This includes work on folk understandings of algorithms, as well as work on how queer and trans communities adapt to social platforms. Outside the lab, I am mostly about cats, space, playing bass, and being in the snow."
  avatar      : images/members/devito_bio.jpg
  twitter     : "drmichaelann"

- name        : "Jes Feuston"
  position    : "Postdoctoral Researcher"
  program     : "Information Science"
  uri         : "http://jesfeuston.com/"
  email       : "jessica.feuston@colorado.edu"
  bio         : "I'm a postdoctoral associate and digital ethnographer in the Department of Information Science at CU Boulder. I completed my Ph.D. at Northwestern University, where I studied how people with mental illness participate online. Recently, my research also involves exploring tools to support qualitative researchers and research practices. I love my plants, embroidery, and my many animal and plant neighbors who graciously tolerate my presence in the yard."
