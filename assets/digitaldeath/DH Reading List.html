<script>
$.getJSON('https://cmci.colorado.edu/idlab/assets/digitaldeath/years.json', function(data) {
     createYearChart(data);
 });



function createYearChart(years) {

	const years = years
	const svg     = d3.select("svg"),
	      margin  = {top: 20, right: 20, bottom: 30, left: 50},
	      width   = +svg.attr("width")  - margin.left - margin.right,
	      height  = +svg.attr("height") - margin.top  - margin.bottom,
	      x       = d3.scaleBand().rangeRound([0, width]).padding(0.2),
	      y       = d3.scaleLinear().rangeRound([height, 0]),
	      g       = svg.append("g")
	                   .attr("transform", `translate(${margin.left},${margin.top})`);

	  data = years;

	  x.domain(data.map(d => d.year));
	  y.domain([0, d3.max(data, d => d.count)]);

	  g.append("g")
	      .attr("class", "axis axis-x")
	      .attr("transform", `translate(0,${height})`)
	      .call(d3.axisBottom(x));

	  g.append("g")
	      .attr("class", "axis axis-y")
	      .call(d3.axisLeft(y).ticks(5).tickSize(8));

	  g.selectAll(".bar")
	    .data(data)
	    .enter().append("rect")
	      .attr("class", "bar")
	      .attr("x", d => x(d.year))
	      .attr("y", d => y(d.count))
	      .attr("width", x.bandwidth())
	      .attr("height", d => height - y(d.count));

}

</script>

<script>
    function createTableFromJSON(data) {

        dataLength = Object.keys(data).length;

        // Container variable
        var col = [];
        // Loop through data and add to container
        for (var i = 0; i < dataLength; i++) {
            for (var key in data[i]) {
                if (col.indexOf(key) === -1) {
                    col.push(key);
                }
            }
        }

        // CREATE DYNAMIC TABLE.
        var table = document.createElement("table");
				table.setAttribute("id", "dataTable");

        // CREATE HTML TABLE HEADER ROW USING THE EXTRACTED HEADERS ABOVE.
        // TABLE ROW.
				var header = table.createTHead();
				var th = header.insertRow(0);

        for (var i = 0; i < col.length; i++) {
            cell = th.insertCell(0);      // TABLE HEADER.
            cell.innerHTML = col[i];
        }

        // ADD JSON DATA TO THE TABLE AS ROWS.
        for (var i = 0; i < dataLength; i++) {

            tr = table.insertRow();

            for (var j = 0; j < col.length; j++) {
                var tabCell = tr.insertCell();
                tabCell.innerHTML = data[i][col[j]];
            }
        }

        // FINALLY ADD THE NEWLY CREATED TABLE WITH JSON DATA TO A CONTAINER.
        var divContainer = document.getElementById("showData");
        divContainer.innerHTML = "";
        divContainer.appendChild(table);
				// $('#dataTable').dataTable();
    };
</script>
<body>
    <input type="button" onclick="createTableFromJSON(jsonData)" value="Create Table From JSON" />
    <div id="showData"></div>
