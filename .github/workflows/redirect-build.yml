
## What this workflow does:

✅ **Builds the Jekyll site** from your redirect branch  
✅ **Creates a new branch** called `redirect-deploy` (or uses existing)  
✅ **Pushes the built site** to that branch  
✅ **Uses force push** to ensure clean deployment  

## Alternative branch names:

You can change `redirect-deploy` to any branch name you prefer:
- `gh-pages` (traditional GitHub Pages branch)
- `redirect-site`
- `deploy-redirect`
- `redirect-build`

## To use this:

1. **Create the workflow file** above
2. **Push to the redirect branch** to trigger the build
3. **The built site will be available** in the `redirect-deploy` branch
4. **You can then deploy** that branch to your server however you prefer

## What branch name would you like to use?

Just let me know what you'd like to call the deployment branch and I can update the workflow accordingly!

name: Build Redirect Site to Branch

on:
  push:
    branches: ["redirect"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: true
      
      - name: Install dependencies
        run: bundle install
      
      - name: Build with Jekyll
        run: bundle exec jekyll build --verbose
        env:
          JEKYLL_ENV: production
      
      - name: Deploy to branch
        run: |
          # Move _site/ temporarily
          mv _site ../site-temp
          
          # Clean everything
          git clean -fdx
          
          # Fetch and switch to deploy branch
          git fetch origin
          git checkout redirect-deploy || git checkout -b redirect-deploy origin/redirect-deploy || git checkout -b redirect-deploy
          
          # Set Git user
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Clean the deploy branch
          git rm -rf . > /dev/null 2>&1 || true
          
          # Move _site/ back and copy files
          mv ../site-temp _site
          cp -r _site/. .
          
          # Add, commit, push
          git add .
          git commit -m "Build redirect site from redirect branch" || echo "No changes to commit"
          git push origin redirect-deploy --force 