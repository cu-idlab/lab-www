name: Build Jekyll Site

on:
  push:
    branches:
      - prod  # Change this if your main branch is named differently

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby and Jekyll
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'  # Adjust based on your Jekyll version
          bundler-cache: true

      - name: Install dependencies
        run: bundle install

      - name: Build Jekyll site
        run: bundle exec jekyll build

      - name: Deploy to build branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Ensure the build branch exists
          git fetch origin build || git checkout --orphan build

          # Remove old files, copy new build
          git checkout build
          rm -rf *
          cp -r _site/* .

          # Commit and push changes
          git add .
          git commit -m "Build site from latest commit in main"
          git push origin build --force



