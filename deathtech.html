 }

<div class="plot-div">
<svg width="1000" height="500"></svg>
<script>
  // Code for pulling data from website instead of local Const.
//$.getJSON('https://cmci.colorado.edu/idlab/assets/digitaldeath/years.json', function(data) {
     //var data;
		 //data = years;
 //});

const years = [{"year": 2008, "count": "0"}, {"year": 2009, "count": "1"}, {"year": 2010, "count": "3"}, {"year": 2011, "count": "4"}, {"year": 2012, "count": "2"}, {"year": 2013, "count": "1"}, {"year": 2014, "count": "4"}, {"year": 2015, "count": "1"}, {"year": 2016, "count": "5"}, {"year": 2017, "count": "2"}, {"year": 2018, "count": "0"}, {"year": 2019, "count": "0"}, {"year": 2020, "count": "3"}]

const svg     = d3.select("svg"),
      margin  = {top: 20, right: 20, bottom: 20, left: 20}, // these need to be above 50 or so to show axis labels
      width   = +svg.attr("width")  - margin.left - margin.right,
      height  = +svg.attr("height") - margin.top  - margin.bottom,
      x       = d3.scaleBand().rangeRound([0, width]).padding(0.2),
      y       = d3.scaleLinear().rangeRound([height, 0]),
      g       = svg.append("g")
                   .attr("transform", `translate(${margin.left},${margin.top})`);

  data = years;

  x.domain(data.map(d => d.year));
  y.domain([0, d3.max(data, d => d.count)]);

  g.append("g")
      .attr("class", "axis axis-x")
      .attr("transform", `translate(0,${height})`)
      .call(d3.axisBottom(x));

  g.append("g")
      .attr("class", "axis axis-y")
      .call(d3.axisLeft(y).ticks(5).tickSize(8));

  g.selectAll(".bar")
    .data(data)
    .enter().append("rect")
      .attr("class", "bar")
      .attr("x", d => x(d.year))
      .attr("y", d => y(d.count))
      .attr("width", x.bandwidth())
      .attr("height", d => height - y(d.count));



</script>
</div>





<script>
  $(document).ready(function() {
        $('#litTable').DataTable({
          "ajax": 'https://cmci.colorado.edu/idlab/assets/digitaldeath/dhLit_data.json',
          columns: [
            {
                data: 'Publication Year'
            },
            {
                data: 'Author'
            },
            {
                data: 'Title'
            },
            {
                data: 'Publication Title'
            },
            {
                data: 'Link',
                render: function ( data ) {
                        return '<a href="'+data+'"><span class="fa fa-link"></span></a>';
                      }
            },
            {
                data: 'Type'
            }
          ]
      });
  });
</script>
