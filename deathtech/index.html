<style>

.plot-div{
	width: 70%;
  display: block;
  margin: auto;
 }

.bar {
fill: #11c8fa;
}

.bar:hover {
fill: slateblue;
}

.axis-x path {
display: none;
}

.axis text {
font-weight: bold;
}
</style>
</head>
<div class="plot-div">
<svg width="1000" height="500"></svg>
<script>

// Code for pulling data from website
var years;
$.getJSON('https://cmci.colorado.edu/idlab/assets/digitaldeath/years.json', function(data) {
		 years = data;
 });

// years = [{"year": 2008, "count": "0"}, {"year": 2009, "count": "1"}, {"year": 2010, "count": "3"}, {"year": 2011, "count": "4"}, {"year": 2012, "count": "2"}, {"year": 2013, "count": "1"}, {"year": 2014, "count": "4"}, {"year": 2015, "count": "1"}, {"year": 2016, "count": "5"}, {"year": 2017, "count": "2"}, {"year": 2018, "count": "0"}, {"year": 2019, "count": "0"}, {"year": 2020, "count": "3"}]

var svg     = d3.select("svg"),
    margin  = {top: 20, right: 20, bottom: 20, left: 20}, // these need to be above 50 or so to show axis labels
    width   = +svg.attr("width")  - margin.left - margin.right,
    height  = +svg.attr("height") - margin.top  - margin.bottom,
    x       = d3.scaleBand().rangeRound([0, width]).padding(0.2),
    y       = d3.scaleLinear().rangeRound([height, 0]),
    g       = svg.append("g")
                 .attr("transform", `translate(${margin.left},${margin.top})`);

var data = years;

  x.domain(years.map(d => d.year));
  y.domain([0, d3.max(years, d => d.count)]);

  g.append("g")
      .attr("class", "axis axis-x")
      .attr("transform", `translate(0,${height})`)
      .call(d3.axisBottom(x));

  g.append("g")
      .attr("class", "axis axis-y")
      .call(d3.axisLeft(y).ticks(5).tickSize(8));

  g.selectAll(".bar")
    .data(data)
    .enter().append("rect")
      .attr("class", "bar")
      .attr("x", d => x(d.year))
      .attr("y", d => y(d.count))
      .attr("width", x.bandwidth())
      .attr("height", d => height - y(d.count));



</script>
</div>
